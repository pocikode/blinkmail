# Blinkmail Email Worker relay configuration.
#
# This Worker only relays inbound mail to the Blinkmail application. It holds
# no database and serves no assets.
#
# OPERATOR STEPS (see README "Cloudflare Email Routing"):
#   1. Log in to the Blinkmail UI, open Settings, create an API key, and store
#      it as a Worker secret (never in this file):
#        npx wrangler secret put API_KEY
#   2. Set INBOUND_URL below to your public HTTPS endpoint.
#   3. Deploy:
#        npx wrangler deploy
#   4. Enable Email Routing for your domain and point the catch-all rule at
#      this Worker. Deploying alone does NOT create mail routing rules.

name = "blinkmail-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# Not reachable over HTTP; it only processes email events.
workers_dev = false

# Declare the email handler so Cloudflare routes email() events here.
[email]
action = "process"

[vars]
# Public HTTPS URL of the Blinkmail application's inbound endpoint.
# CHANGE THIS to your deployed VPS endpoint.
INBOUND_URL = "https://mail.example.com/api/inbound"

# Reject mail larger than this before forwarding. Keep it equal to the
# application's MAX_INBOUND_BYTES so both sides agree.
MAX_RAW_BYTES = "26214400"

# API_KEY is NOT set here on purpose. Put it in a Wrangler secret:
#   npx wrangler secret put API_KEY

[observability]
enabled = true
