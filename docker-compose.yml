# Blinkmail — single-service Compose deployment.
#
# Copy .env.example to .env, fill in your domains and an initial web UI
# password, then:
#   docker compose up -d --build
#
# The application listens on :8080 inside the container. The published port is
# bound to localhost by default: put a TLS-terminating reverse proxy in front of
# it rather than exposing 8080 to the internet directly. See README "HTTPS".
#
# INITIAL_PASSWORD only seeds the admin password on the first start. Once a
# password exists in the database the variable is ignored, so it is safe (and
# tidy) to remove it from .env afterwards; the password is then changed from the
# UI under Settings. The app refuses to start on a fresh database without it.

services:
  blinkmail:
    build:
      context: .
      dockerfile: Dockerfile
    image: blinkmail:latest
    container_name: blinkmail
    restart: unless-stopped

    # Bind to loopback so the app is not directly reachable from outside the
    # host. Change to "8080:8080" only if you terminate TLS at this port, which
    # is not recommended.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: "/data"
      APP_NAME: "${APP_NAME:-Blinkmail}"
      MAIL_DOMAINS: "${MAIL_DOMAINS:?set MAIL_DOMAINS in .env}"
      # Seeds the web UI admin password on the FIRST start only. Once a password
      # exists in the database this value is ignored, so it is optional here:
      # the app itself refuses to start only when the database has no password
      # yet. Change the password from the UI afterwards (Settings).
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-}"
      # Inbound mail authenticates with a managed API key created in the UI
      # (Settings → API keys); there is no shared secret to configure here.
      MAX_INBOUND_BYTES: "${MAX_INBOUND_BYTES:-26214400}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

    volumes:
      # Named volume persists the SQLite database across container rebuilds and
      # restarts. Removing the container keeps this data; removing the volume
      # (docker compose down -v) destroys it.
      - blinkmail-data:/data

    # Run as the image's non-root user; the distroless nonroot user (uid 65532)
    # owns the volume so SQLite can write the database and its WAL files.
    security_opt:
      - no-new-privileges:true
    # The filesystem is not read-only: SQLite writes WAL and journal files
    # alongside the database in /data. Everything else in the image is static.

    healthcheck:
      test: ["CMD", "/usr/local/bin/blinkmail", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  blinkmail-data:
    # Pin the volume name so it does not depend on the compose project directory.
    # Operator commands in the README can then reference it directly.
    name: blinkmail-data
